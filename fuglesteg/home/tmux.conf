# Fix terminal colors on alacritty
# set -g default-terminal "xterm-256color"
# set -ga terminal-overrides ",$TERM:Tc:256"
set -g default-terminal "$TERM"
set -ga terminal-overrides ",$TERM:Tc:RGB"
# set -g default-terminal "alacritty"
# set -ag terminal-overrides ",$TERM:RGB"

# Stop delay on <Escape>
set -sg escape-time 0

# <tmux-sensible>
set -g history-limit 50000
set -g focus-events on
set -g display-time 4000
set -g status-interval 5

setw -g aggressive-resize on
# </tmux-sensible>

# Pack window numbers
set -g renumber-windows on

# Name windows after the pane title instead of just the running program
set -g automatic-rename-format "#{pane_title}"

# Integrate copy mode with the OS clipboard
set -s set-clipboard on

# Push session/window info to the terminal emulator's title bar
set -g set-titles on
set -g set-titles-string "#S / #W"

# reload config
unbind g
bind g source-file ~/.tmux.conf

# Index at 1
set -g base-index 1
setw -g pane-base-index 1

# Set prefix
set -g prefix M-f

# Reload config
unbind g
bind g source-file ~/.tmux.conf

# Mouse support
setw -g mouse on

# Vim like bindings
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key s split-pane
bind-key v split-pane -h
bind-key d kill-pane
bind-key w choose-tree -Zs
bind-key Tab switch-client -l

# Other keymaps
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#S" "rename-session '%%'"
bind-key q detach

# Status bar
tmux_bg_dark=#22252b
tmux_bg_light=#282c34
tmux_text=#98be65

tmux_status_background=$tmux_bg_light
tmux_status_window_background=$tmux_bg_dark
tmux_status_window_text=$tmux_text
tmux_status_current_window_background=$tmux_text
tmux_status_current_window_text=$tmux_bg_dark

# Customize status bar
set -g status-position top
set -g status-justify centre
set -g status-style fg=$tmux_text,bg=$tmux_bg_light
set -g window-status-current-format "\
#[fg=$tmux_status_current_window_background,bg=$tmux_status_background]\
#[reverse]#I:#W\
#[noreverse]"
set -g window-status-format "\
#[fg=$tmux_status_window_background,bg=$tmux_status_background]\
#[fg=$tmux_status_window_text,bg=$tmux_status_window_background]#I:#W\
#[fg=$tmux_status_window_background,bg=$tmux_status_background]"
